name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript Types
        run: npm run typecheck

      - name: Build Monorepo Packages & Apps
        run: npm run build

  integration-tests:
    name: Database Gate & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nvara
          POSTGRES_USER: nvara
          POSTGRES_PASSWORD: nvara_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Packages
        run: npm run build

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgres://nvara:nvara_ci_password@localhost:5432/nvara
        run: npm run db:migrate

      - name: Seed Demo Data
        env:
          DATABASE_URL: postgres://nvara:nvara_ci_password@localhost:5432/nvara
        run: npm run db:seed

      - name: Validate Database Schema Gate
        env:
          DATABASE_URL: postgres://nvara:nvara_ci_password@localhost:5432/nvara
        run: npm run db:validate

      - name: Start API Server in Background
        env:
          DATABASE_URL: postgres://nvara:nvara_ci_password@localhost:5432/nvara
          NODE_ENV: test
          DEV_AUTH_ENABLED: "true"
          DEFAULT_ORGANIZATION_NAME: "Nvara Media"
          PUBLIC_RATE_LIMIT_PER_MINUTE: 1000
          API_PORT: 4012
          WEB_ORIGIN: "http://localhost:5173"
          LOG_LEVEL: silent
        run: |
          npx tsx apps/api/src/server.ts &
          sleep 3

      - name: Run Client Request Integration Tests
        env:
          DATABASE_URL: postgres://nvara:nvara_ci_password@localhost:5432/nvara
          API_ORIGIN: http://127.0.0.1:4012
        run: npm run test:integration

      - name: Run Workflow Integration Tests
        env:
          DATABASE_URL: postgres://nvara:nvara_ci_password@localhost:5432/nvara
          API_ORIGIN: http://127.0.0.1:4012
        run: npm run test:integration:workflow

      - name: Run Concurrency Hardening Integration Tests
        env:
          DATABASE_URL: postgres://nvara:nvara_ci_password@localhost:5432/nvara
          API_ORIGIN: http://127.0.0.1:4012
        run: npm run test:integration:hardening

      - name: Run SLA Escalation Worker Tests
        env:
          DATABASE_URL: postgres://nvara:nvara_ci_password@localhost:5432/nvara
        run: npm run test:integration:worker

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nvara
          POSTGRES_USER: nvara
          POSTGRES_PASSWORD: nvara_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Packages
        run: npm run build

      - name: Run Database Migrations & Seed
        env:
          DATABASE_URL: postgres://nvara:nvara_ci_password@localhost:5432/nvara
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Run Playwright E2E Tests
        env:
          DATABASE_URL: postgres://nvara:nvara_ci_password@localhost:5432/nvara
          DEV_AUTH_ENABLED: "true"
          DEFAULT_ORGANIZATION_NAME: "Nvara Media"
          PUBLIC_RATE_LIMIT_PER_MINUTE: 1000
          API_PORT: 4000
          WEB_ORIGIN: "http://localhost:5173"
        run: npm run test:e2e

      - name: Upload Playwright Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
