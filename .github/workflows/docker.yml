name: Docker Build Validation

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.*'
      - 'docker-compose*.yml'
      - 'apps/**'
      - 'packages/**'
      - 'package*.json'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile.*'
      - 'docker-compose*.yml'
      - 'apps/**'
      - 'packages/**'
      - 'package*.json'

jobs:
  build-containers:
    name: Validate Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: false
          tags: nvara-api:ci-test

      - name: Build Worker Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: false
          tags: nvara-worker:ci-test

      - name: Build Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.web
          push: false
          tags: nvara-web:ci-test
